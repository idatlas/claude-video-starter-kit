<!doctype html>
<html><head><meta charset="utf-8">
<!-- Promo / marketing video from stock footage and photos, cut to a voiceover.
  project.json:
    "audio": "voice.mp3", "words": "words.json", "music": {"file": "music.mp3", "db": -20}
    "brand": {"accent": "#FF7A45", "bg": "#101318", "font": "Inter", "fontDisplay": "Poppins"}
    "scenes": [
      {"start": 0, "end": 4.2, "kind": "video", "src": "stock/video-123.mp4", "in": 2.0,
       "move": "in", "focus": [0.5, 0.4],
       "text": {"headline": "Your words here", "sub": "smaller line", "position": "left"}},
      {"start": 4.2, "end": 8, "kind": "photo", "src": "stock/photo-456.jpg", "move": "left", "fade": 0.5},
      {"start": 26, "end": 31, "kind": "card", "headline": "Make videos with Claude", "sub": "...", "cta": "Start the course"}
    ]
    kind:     video | photo | card (a brand-colored end card)
    in:       (video) second of the clip to start from
    move:     in | out | left | right | up | none   slow push or drift (the "Ken Burns" look)
    focus:    [x, y] the part of the picture to keep when it's cropped to fill the frame
    fade:     seconds to cross-fade from the scene before (default 0 = straight cut)
    captions: false hides the captions during this scene (e.g. an end card that shows the words)
    **word** in a headline shows that word in the accent color
    text.position: left | center | lower | right -->
<link rel="stylesheet" href="../lib/base.css">
<style>
  .scene { position: absolute; inset: 0; overflow: hidden; }
  .scene img.media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .scrim { position: absolute; inset: 0; }
  .txt { position: absolute; max-width: 62vw; }
  .txt.left { left: 7vw; top: 50%; transform: translateY(-50%); }
  .txt.right { right: 7vw; top: 50%; transform: translateY(-50%); text-align: right; }
  .txt.center { left: 50%; top: 46%; transform: translate(-50%, -50%); text-align: center; max-width: 80vw; }
  .txt.lower { left: 7vw; bottom: 20vh; }
  .txt h1 { font: 800 9vh/1.02 var(--font-display), sans-serif; letter-spacing: -.02em; text-shadow: 0 .6vh 3vh rgba(0,0,0,.45); }
  .txt h1 .acc { color: var(--accent); }
  .txt p { font: 600 3.4vh/1.3 var(--font), sans-serif; margin-top: 2vh; opacity: .92; text-shadow: 0 .3vh 1.5vh rgba(0,0,0,.5); }
  .txt .wd { display: inline-block; }
  .card { background: radial-gradient(120% 120% at 20% 10%, var(--bg2), var(--bg) 65%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card h1 { font: 800 10vh/1.02 var(--font-display), sans-serif; letter-spacing: -.02em; max-width: 80vw; }
  .card p { font: 500 3.6vh/1.35 var(--font), sans-serif; opacity: .85; margin-top: 2.4vh; max-width: 70vw; }
  .card .cta { margin-top: 5vh; font: 700 3.2vh var(--font), sans-serif; color: #1F2430; background: var(--accent); padding: 1.8vh 4vh; border-radius: 5vh; }
  .card .bar { width: 10vh; height: .8vh; background: var(--accent); border-radius: 1vh; margin-bottom: 4vh; }
</style></head>
<body><div id="stage"></div>
<script src="../lib/engine.js"></script>
<script src="../lib/captions.js"></script>
<script>
const D = window.DATA, stage = document.getElementById('stage');
K.brand();
const S = D.scenes || [];
// a **word** in a headline is shown in the accent color
const rich = s => K.esc(s).split(/(\*\*.+?\*\*)/).map(part => part.startsWith('**')
  ? `<span class="acc">${part.slice(2, -2).split(' ').map(w => `<span class="wd">${w}</span>`).join(' ')}</span>`
  : part.split(' ').filter(Boolean).map(w => `<span class="wd">${w}</span>`).join(' ')).join(' ');

window.READY = (async () => {
  S.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'scene' + (s.kind === 'card' ? ' card' : '');
    el.style.zIndex = i + 1;
    if (s.kind === 'card') {
      el.innerHTML = `<div class="bar"></div><h1>${rich(s.headline || '')}</h1>` + (s.sub ? `<p>${K.esc(s.sub)}</p>` : '') + (s.cta ? `<div class="cta">${K.esc(s.cta)}</div>` : '');
    } else {
      el.innerHTML = '<img class="media">';
      const f = s.focus || [0.5, 0.5];
      el.querySelector('img').style.objectPosition = `${f[0] * 100}% ${f[1] * 100}%`;
      if (s.text) {
        const pos = s.text.position || 'left';
        const grad = { left: 'linear-gradient(90deg, rgba(0,0,0,.62), rgba(0,0,0,.15) 65%, transparent)',
                       right: 'linear-gradient(270deg, rgba(0,0,0,.62), rgba(0,0,0,.15) 65%, transparent)',
                       center: 'radial-gradient(70% 60% at 50% 46%, rgba(0,0,0,.5), rgba(0,0,0,.12))',
                       lower: 'linear-gradient(0deg, rgba(0,0,0,.7), transparent 60%)' }[pos];
        el.innerHTML += `<div class="scrim" style="background:${grad}"></div><div class="txt ${pos}"><h1>${rich(s.text.headline || '')}</h1>` +
                        (s.text.sub ? `<p>${K.esc(s.text.sub)}</p>` : '') + '</div>';
      }
    }
    stage.appendChild(el);
    s.el = el;
  });
  await Promise.all(S.filter(s => s.kind === 'photo').map(s => K.loadImg(s.el.querySelector('img'), K.asset(s.src))));
  Captions.mount(stage);
})();

function moveFor(s, p) {
  const e = K.ease.inOut(p), m = s.move || 'in', amt = s.amount || 0.1;
  switch (m) {
    case 'in': return `scale(${1 + amt * e})`;
    case 'out': return `scale(${1 + amt * (1 - e)})`;
    case 'left': return `scale(${1 + amt}) translateX(${(0.5 - e) * amt * 80}%)`;
    case 'right': return `scale(${1 + amt}) translateX(${(e - 0.5) * amt * 80}%)`;
    case 'up': return `scale(${1 + amt}) translateY(${(0.5 - e) * amt * 80}%)`;
    default: return 'none';
  }
}

window.render = async (t) => {
  const waits = [];
  S.forEach((s, i) => {
    const next = S[i + 1], tail = next ? (next.fade || 0) : 0;
    const on = t >= s.start && t < s.end + tail;
    s.el.style.display = on ? '' : 'none';
    if (!on) return;
    s.el.style.opacity = s.fade ? K.prog(t, s.start, s.start + s.fade) : 1;
    const p = K.prog(t, s.start, s.end + tail);
    const img = s.el.querySelector('img.media');
    if (img) {
      img.style.transform = moveFor(s, p);
      if (s.kind === 'video') waits.push(K.loadImg(img, K.seq(s.frames, t - s.start)));
    }
    // text: words rise in one after another, then the whole block fades before the cut
    const words = s.el.querySelectorAll('.wd');
    const t0 = s.start + (s.textDelay != null ? s.textDelay : 0.25);
    words.forEach((w, k) => {
      const q = K.ease.out(K.prog(t, t0 + k * 0.07, t0 + k * 0.07 + 0.5));
      w.style.opacity = q; w.style.transform = `translateY(${(1 - q) * 3}vh)`;
    });
    s.el.querySelectorAll('.txt p, .card p, .card .cta, .card .bar').forEach((x, k) => {
      const q = K.ease.out(K.prog(t, t0 + words.length * 0.07 + 0.15 + k * 0.12, t0 + words.length * 0.07 + 0.65 + k * 0.12));
      x.style.opacity = q; x.style.transform = `translateY(${(1 - q) * 2}vh)`;
    });
    const txt = s.el.querySelector('.txt');
    if (txt && next) txt.style.opacity = 1 - K.prog(t, s.end - 0.3, s.end);
  });
  await Promise.all(waits);
  Captions.update(t);
  // a scene with "captions": false hides them (an end card that already shows the words)
  const cur = S.find(s => t >= s.start && t < s.end);
  if (Captions.el && cur && cur.captions === false) Captions.el.style.opacity = 0;
};
</script></body></html>
